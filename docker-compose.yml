# El APF2 utiliza MySQL ya instalado en Windows en 127.0.0.1:3306.
# Este Compose NO se requiere para ejecutar el frontend actual.
# Perfiles opcionales:
#   docker compose --profile db-container up -d mariadb
#   docker compose --profile extras up -d redis minio
# Configurar contraseñas reales SOLO en .env privado antes de levantar contenedores.
services:
  mariadb:
    image: mariadb:11.4
    profiles: ["db-container"]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-aiblockstudio}
      MARIADB_USER: ${MARIADB_APP_USER:-app_user}
      MARIADB_PASSWORD: ${MARIADB_APP_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:${MARIADB_DOCKER_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    profiles: ["extras"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    profiles: ["extras"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mariadb_data:
  redis_data:
  minio_data:
