name: frontend-hito7

on:
  pull_request:
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-hito7.yml'
  push:
    branches: [main]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-hito7.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
