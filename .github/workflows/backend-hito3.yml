name: Backend APF2
on:
  push:
    paths: ['Backend/**', 'database/schema.sql', '.github/workflows/backend-hito3.yml']
  pull_request:
    paths: ['Backend/**', 'database/schema.sql', '.github/workflows/backend-hito3.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: mysql://validation:validation@127.0.0.1:3306/validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm test
      - name: Baseline preserves original SQL
        run: cmp prisma/migrations/0_init/migration.sql ../database/schema.sql
